<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝宝识字启蒙台</title>
<style>
  :root{
    --bg:#FFF7EC; --card:#FFFFFF; --ink:#3A3326; --sub:#8A8170;
    --main:#FF9F43; --main-d:#F0840C; --blue:#54A0FF; --green:#1DD1A1;
    --pink:#FF6B9D; --red:#EE5253; --yellow:#FFD93D; --line:#F0E6D6;
    --shadow:0 6px 18px rgba(240,160,60,.15); --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;
    padding-bottom:calc(env(safe-area-inset-bottom) + 70px);}
  .wrap{max-width:780px;margin:0 auto;padding:14px 14px 20px;}
  .tabs{display:flex;gap:10px;position:sticky;top:0;background:var(--bg);z-index:20;padding:10px 0 8px;}
  .tab{flex:1;min-height:52px;border:none;border-radius:16px;font-size:18px;font-weight:700;background:#fff;color:var(--sub);
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
  .tab.active{background:var(--main);color:#fff;}
  .tab svg{width:24px;height:24px;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 12px;}
  .head h1{font-size:23px;margin:0;display:flex;align-items:center;gap:8px;}
  .head .pts{background:var(--yellow);color:#7a5a00;font-weight:800;border-radius:30px;padding:8px 16px;font-size:17px;
    display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);}
  .head .pts svg{width:20px;height:20px;}
  .today{background:linear-gradient(135deg,#FFF3E0,#FFE6F0);border-radius:var(--radius);padding:14px 14px 12px;margin-bottom:16px;box-shadow:var(--shadow);}
  .today h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .today h2 svg{width:22px;height:22px;}
  .today-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .chip{flex:0 0 auto;min-width:96px;background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.06);}
  .chip .c{border-radius:12px;background:#FFF7EC;font-size:30px;font-weight:800;padding:6px 0;color:var(--ink);}
  .chip.overdue .c{background:#FFE3E3;color:var(--red);}
  .chip .tag{font-size:12px;color:var(--sub);margin:6px 0 4px;min-height:16px;}
  .chip.overdue .tag{color:var(--red);font-weight:700;}
  .chip button{min-height:44px;border:none;border-radius:12px;background:var(--main);color:#fff;font-weight:700;font-size:15px;padding:0 14px;cursor:pointer;}
  .chip.overdue button{background:var(--red);}
  .sec{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .sec h2{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .sec h2 svg{width:22px;height:22px;}
  .sec .hint{font-size:14px;color:var(--sub);margin:-6px 0 12px;}
  .card-stage{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .flip{width:200px;height:200px;perspective:900px;cursor:pointer;}
  .flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .flip.done .flip-in{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.1);overflow:hidden;}
  .face.front{background:linear-gradient(135deg,#FFE9C7,#FFD6E8);font-size:120px;font-weight:800;color:var(--ink);}
  .face.back{background:#fff;transform:rotateY(180deg);flex-direction:column;padding:10px;}
  .face.back .pic{width:120px;height:120px;}
  .face.back .py{font-size:22px;color:var(--main-d);font-weight:800;margin-top:2px;}
  .face.back .mn{font-size:15px;color:var(--sub);}
  .card-nav{display:flex;align-items:center;gap:14px;width:100%;justify-content:center;}
  .nav-btn{min-width:52px;min-height:52px;border-radius:50%;border:none;background:#FFF0DD;color:var(--main-d);font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .nav-btn:disabled{opacity:.35;}
  .card-idx{font-size:15px;color:var(--sub);min-width:60px;text-align:center;}
  .learn-btn{min-height:54px;border:none;border-radius:16px;background:var(--green);color:#fff;font-weight:800;font-size:18px;padding:0 22px;cursor:pointer;box-shadow:var(--shadow);}
  .learn-btn:disabled{background:#CFE9DF;cursor:default;}
  .quiz-word{text-align:center;font-size:80px;font-weight:800;color:var(--blue);margin:4px 0 6px;}
  .quiz-q{text-align:center;color:var(--sub);font-size:15px;margin-bottom:10px;}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .opt{min-height:78px;border:3px solid var(--line);border-radius:18px;background:#fff;font-size:40px;font-weight:800;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .opt.ok{border-color:var(--green);background:#E8FBF3;}
  .opt.no{border-color:var(--red);background:#FFEDED;animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .quiz-fb{text-align:center;font-size:18px;font-weight:800;min-height:26px;margin-top:10px;}
  .quiz-fb.ok{color:var(--green);} .quiz-fb.no{color:var(--red);}
  .shop-item{display:flex;align-items:center;gap:12px;background:#FFF9F0;border-radius:16px;padding:12px;margin-bottom:10px;}
  .shop-ic{width:46px;height:46px;flex:0 0 auto;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .shop-ic svg{width:30px;height:30px;}
  .shop-info{flex:1;}
  .shop-info .n{font-weight:800;font-size:17px;}
  .shop-info .c{font-size:14px;color:var(--main-d);font-weight:700;}
  .shop-btn{min-height:50px;border:none;border-radius:14px;background:var(--main);color:#fff;font-weight:800;font-size:15px;padding:0 16px;cursor:pointer;}
  .shop-btn:disabled{background:#E7DDCD;cursor:default;}
  .tools{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{min-height:50px;border:none;border-radius:14px;font-weight:700;font-size:15px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow);}
  .btn svg{width:18px;height:18px;}
  .btn.ghost{background:#fff;color:var(--sub);}
  .btn.warn{background:#FFEDED;color:var(--red);}
  .btn.main{background:var(--main);color:#fff;}
  .btn.green{background:var(--green);color:#fff;}
  .mask{position:fixed;inset:0;background:rgba(58,51,38,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:420px;max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:8px;}
  .modal label{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px;}
  .modal input,.modal select{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;background:#FFFDF8;color:var(--ink);}
  .modal input:focus,.modal select:focus{outline:none;border-color:var(--main);}
  .modal .row{display:flex;gap:10px;margin-top:18px;}
  .modal .row .btn{flex:1;justify-content:center;}
  .field{margin-bottom:14px;}
  .field>label{font-size:15px;font-weight:700;display:block;margin-bottom:8px;}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#FFF0DD;color:var(--main-d);border-radius:20px;padding:6px 12px;font-size:14px;margin:0 6px 6px 0;font-weight:700;}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:200px;overflow:auto;padding:4px;}
  .lib-cell{background:#FFF9F0;border-radius:12px;padding:8px 4px;text-align:center;}
  .lib-cell .lc{font-size:26px;font-weight:800;}
  .lib-cell .lp{font-size:11px;color:var(--sub);}
  .exchange-row{display:flex;align-items:center;gap:10px;background:#FFF9F0;border-radius:14px;padding:10px 12px;margin-bottom:8px;}
  .exchange-row .en{flex:1;font-weight:700;}
  .exchange-row .ec{font-size:13px;color:var(--main-d);}
  .exchange-row .eb{min-height:44px;border:none;border-radius:11px;background:var(--green);color:#fff;font-weight:700;padding:0 12px;cursor:pointer;}
  .exchange-row .eb.no{background:var(--red);}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;opacity:0;transition:.3s;z-index:80;pointer-events:none;font-size:15px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{text-align:center;color:var(--sub);padding:18px;font-size:15px;}
  .lock-note{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.5;}
  .ppad{padding:6px 2px;}
  @media(max-width:560px){
    .opts{gap:8px;} .opt{min-height:68px;font-size:34px;}
    .quiz-word{font-size:64px;} .head h1{font-size:20px;}
  }
</style>
</head>

/* ============ 状态 ============ */
const KEY='wb_shizi_state';
let state=null, mode='kid', cardIdx=0, quiz=null, parentOk=false;
const uid=()=>Date.now()+''+Math.floor(Math.random()*1000);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function defaultState(){
  const lib=WORDS.map(w=>({...w}));
  const today=[
    {char:'日',status:'overdue',learned:false},
    {char:'月',status:'today',learned:false},
    {char:'山',status:'today',learned:false},
    {char:'水',status:'today',learned:false},
    {char:'火',status:'today',learned:false}
  ];
  return {lib,today,points:0,
    shop:[
      {id:uid(),name:'看一集动画片',cost:10,icon:'starG'},
      {id:uid(),name:'吃一个冰淇淋',cost:15,icon:'cookie'},
      {id:uid(),name:'去公园玩一会儿',cost:20,icon:'toy'},
      {id:uid(),name:'多讲一个故事',cost:8,icon:'book'}
    ],
    exchanges:[],pwd:'',daily:5,lastDay:null};
}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return null;return JSON.parse(s);}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ============ 渲染 ============ */
const app=document.getElementById('app');
function render(){
  document.getElementById('tabKid').classList.toggle('active',mode==='kid');
  document.getElementById('tabParent').classList.toggle('active',mode==='parent');
  app.innerHTML = mode==='kid'? renderKid() : renderParent();
  if(cardIdx>=state.today.length) cardIdx=Math.max(0,state.today.length-1);
}

function renderKid(){
  return `<div class="head"><h1>宝宝识字启蒙台</h1>
    <div class="pts">${ICON.star}${state.points} 分</div></div>
    ${todayBox()}
    ${cardSection()}
    ${quizSection()}
    ${shopSection()}
    ${toolsRow()}`;
}
function todayBox(){
  const chips=state.today.map((t,i)=>{
    const cls=t.status==='overdue'?'chip overdue':'chip';
    const tag=t.learned?'已学会 ✓':(t.status==='overdue'?'昨日未学·顺延':'今天要学');
    const btn=t.learned?'<button disabled>学会啦</button>':`<button data-act="goto" data-i="${i}">去学习</button>`;
    return `<div class="${cls}"><div class="c">${t.char}</div><div class="tag">${tag}</div>${btn}</div>`;
  }).join('') || '<div class="empty">今日还没有任务，去家长模式生成吧～</div>';
  return `<div class="today"><h2>${ICON.bell}今天要处理（${state.daily}个字）</h2>
    <div class="today-list">${chips}</div></div>`;
}
function cardSection(){
  if(!state.today.length) return '<div class="sec"><div class="empty">今天没有任务啦～</div></div>';
  const t=state.today[cardIdx]; const w=state.lib.find(x=>x.char===t.char)||{py:'',mn:''};
  const done=t.learned;
  return `<div class="sec" id="cardSec"><h2>${ICON.card}象形字卡片</h2>
    <div class="card-stage">
      <div class="flip ${done?'done':''}" data-act="flip">
        <div class="flip-in">
          <div class="face front">${t.char}</div>
          <div class="face back"><div class="pic">${PIC[t.char]||PIC['日']}</div><div class="py">${w.py}</div><div class="mn">${w.mn}</div></div>
        </div>
      </div>
      <div class="card-nav">
        <button class="nav-btn" data-act="prev" ${cardIdx===0?'disabled':''}>‹</button>
        <div class="card-idx">${cardIdx+1} / ${state.today.length}</div>
        <button class="nav-btn" data-act="next" ${cardIdx===state.today.length-1?'disabled':''}>›</button>
      </div>
      <button class="learn-btn" data-act="learn" ${done?'disabled':''}>${done?'已学会 +2分':'我学会了 +2分'}</button>
    </div></div>`;
}
function makeQuiz(){
  const learned=state.today.filter(t=>t.learned).map(t=>t.char);
  const chars=learned.length?learned:state.lib.map(w=>w.char);
  const ch=chars[Math.floor(Math.random()*chars.length)];
  const w=state.lib.find(x=>x.char===ch);
  const word=w.words[Math.floor(Math.random()*w.words.length)];
  const ans=word[1];
  const others=shuffle(state.lib.map(x=>x.char).filter(c=>c!==ans));
  const opts=shuffle([ans,others[0],others[1]]);
  return {ch,word,ans,opts,done:false,picked:null,fb:null};
}
function quizSection(){
  if(!quiz) quiz=makeQuiz();
  const fb=quiz.fb?`<div class="quiz-fb ${quiz.fb.ok?'ok':'no'}">${quiz.fb.txt}</div>`:'';
  const opts=quiz.opts.map(o=>`<button class="opt ${quiz.picked===o?(o===quiz.ans?'ok':'no'):''}" data-act="pick" data-o="${o}" ${quiz.done?'disabled':''}>${o}</button>`).join('');
  return `<div class="sec"><h2>${ICON.puzzle}组词练习</h2>
    <div class="quiz-word">${quiz.ch}</div>
    <div class="quiz-q">「${quiz.ch}」和哪个字做好朋友？→ ${quiz.word}</div>
    <div class="opts">${opts}</div>${fb}
    <div style="text-align:center;margin-top:12px"><button class="btn ghost" data-act="newquiz">换一题</button></div></div>`;
}
function shopSection(){
  const items=state.shop.map(s=>{
    const can=state.points>=s.cost;
    return `<div class="shop-item"><div class="shop-ic">${ICON[s.icon]||ICON.gift}</div>
      <div class="shop-info"><div class="n">${s.name}</div><div class="c">${s.cost} 分</div></div>
      <button class="shop-btn" data-act="redeem" data-id="${s.id}" ${can?'':'disabled'}>兑换</button></div>`;
  }).join('');
  return `<div class="sec"><h2>${ICON.gift}闯关积分商城</h2>
    <div class="hint">攒够积分就能换小奖励，兑换要等爸爸妈妈确认哦～</div>
    ${items||'<div class="empty">商城还没有奖励，去家长模式添加吧</div>'}</div>`;
}
function toolsRow(){
  return `<div class="tools" style="margin-top:4px">
    <button class="btn main" data-act="export">${ICON.down}导出备份</button>
    <button class="btn ghost" data-act="import">${ICON.up}导入恢复</button>
    <button class="btn warn" data-act="cleareg">${ICON.trash}清空示例</button></div>`;
}

/* ============ 家长模式 ============ */
function renderParent(){
  if(!state.pwd) return parentSetPwd();
  if(!parentOk) return parentLogin();
  return parentPanel();
}
function parentSetPwd(){
  return `<div class="sec" style="margin-top:16px"><h2>${ICON.shield}设置家长密码</h2>
    <div class="hint">首次使用请设置4位数字密码，用来保护家长设置（小朋友误触也打不开）。</div>
    <div class="field"><label>4位数字密码</label>
      <input id="pwdInput" type="password" inputmode="numeric" maxlength="4" placeholder="例如 1234"></div>
    <button class="btn main" data-act="setpwd" style="width:100%;justify-content:center">保存密码</button>
    <div class="lock-note">说明：密码只存在本机浏览器，用于防误触，并非加密保护。</div></div>`;
}
function parentLogin(){
  return `<div class="sec" style="margin-top:16px"><h2>${ICON.shield}家长验证</h2>
    <div class="hint">请输入4位家长密码进入管理。</div>
    <div class="field"><label>密码</label>
      <input id="pwdInput" type="password" inputmode="numeric" maxlength="4" placeholder="请输入密码"></div>
    <button class="btn main" data-act="login" style="width:100%;justify-content:center">进入</button>
    <div class="lock-note">忘记密码？在家长模式里可「清空全部数据」后重新设置。</div></div>`;
}
function parentPanel(){
  const libPills=state.lib.map(w=>`<span class="pill">${w.char} <small style="opacity:.7">${w.py}</small></span>`).join('');
  const pend=state.exchanges.filter(e=>e.status==='pending');
  const exRows=pend.length?pend.map(e=>`<div class="exchange-row"><div><div class="en">${e.name}</div><div class="ec">${e.cost} 分 · 待确认</div></div>
    <button class="eb" data-act="confirm-ex" data-id="${e.id}">确认</button>
    <button class="eb no" data-act="reject-ex" data-id="${e.id}">拒绝</button></div>`).join('')
    :'<div class="empty">暂无待确认的兑换～</div>';
  return `<div class="head"><h1>家长管理台</h1><div class="pts">${ICON.star}${state.points} 分</div></div>
  <div class="sec"><h2>${ICON.card}每日任务</h2>
    <div class="field"><label>每天学几个字：<b>${state.daily}</b> 个</label>
      <input id="dailyInput" type="number" min="1" max="20" value="${state.daily}"></div>
    <button class="btn main" data-act="gen" style="width:100%;justify-content:center">生成今日任务</button>
    <div class="lock-note">生成会从字库按顺序取字；之前没学会的会从「今天要处理」里消失，建议先陪宝宝完成。</div>
  </div>
  <div class="sec"><h2>${ICON.book}字库（${state.lib.length}字）</h2>
    <div style="margin-bottom:10px"><button class="btn green" data-act="open-addword">+ 添加自定义字</button>
      <button class="btn ghost" data-act="open-libpool">+ 从字库宝库添加</button></div>
    <div>${libPills}</div>
  </div>
  <div class="sec"><h2>${ICON.gift}积分商城奖励</h2>
    <div id="shopList">${shopListHtml()}</div>
    <button class="btn green" data-act="open-addshop" style="margin-top:8px">+ 添加奖励</button>
  </div>
  <div class="sec"><h2>${ICON.shield}兑换确认</h2>${exRows}</div>
  <div class="sec"><h2>其他设置</h2>
    <div class="tools">
      <button class="btn ghost" data-act="open-chpwd">${ICON.shield}修改密码</button>
      <button class="btn main" data-act="export">${ICON.down}导出备份</button>
      <button class="btn ghost" data-act="import">${ICON.up}导入恢复</button>
      <button class="btn warn" data-act="clearall">${ICON.trash}清空全部数据</button>
    </div>
  </div>`;
}
function shopListHtml(){
  return state.shop.map(s=>`<div class="shop-item"><div class="shop-ic">${ICON[s.icon]||ICON.gift}</div>
    <div class="shop-info"><div class="n">${s.name}</div><div class="c">${s.cost} 分</div></div>
    <button class="eb no" data-act="del-shop" data-id="${s.id}">删除</button></div>`).join('');
}

/* ============ 交互 ============ */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('mask').classList.add('show');}
function closeModal(){document.getElementById('mask').classList.remove('show');}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act;
  switch(act){
    case 'tab': mode=t.dataset.mode; if(mode==='parent'&&state.pwd&&!parentOk){/*show login*/} render(); break;
    case 'flip': t.classList.toggle('done'); break;
    case 'prev': if(cardIdx>0){cardIdx--;render();} break;
    case 'next': if(cardIdx<state.today.length-1){cardIdx++;render();} break;
    case 'goto': cardIdx=+t.dataset.i; render(); setTimeout(()=>document.getElementById('cardSec')?.scrollIntoView({behavior:'smooth',block:'center'}),60); break;
    case 'learn': doLearn(); break;
    case 'pick': doPick(t.dataset.o); break;
    case 'newquiz': quiz=null; render(); break;
    case 'redeem': doRedeem(t.dataset.id); break;
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'cleareg': openClearEg(); break;
    case 'setpwd': setPwd(); break;
    case 'login': login(); break;
    case 'gen': genToday(); break;
    case 'open-addword': openAddWord(); break;
    case 'add-word': addWord(); break;
    case 'open-libpool': openLibPool(); break;
    case 'add-pool': addPool(t.dataset.char); break;
    case 'open-addshop': openAddShop(); break;
    case 'add-shop': addShop(); break;
    case 'del-shop': delShop(t.dataset.id); break;
    case 'confirm-ex': confirmEx(t.dataset.id); break;
    case 'reject-ex': rejectEx(t.dataset.id); break;
    case 'open-chpwd': openChpwd(); break;
    case 'chpwd': chpwd(); break;
    case 'clearall': clearAll(); break;
    case 'close-modal': closeModal(); break;
  }
});

function doLearn(){
  const t=state.today[cardIdx]; if(!t||t.learned)return;
  t.learned=true; state.points+=2; toast('学会啦！+2分');
  if(state.today.every(x=>x.learned)){state.points+=5; toast('今日通关！额外+5分');}
  save(); render();
}
function doPick(o){
  if(!quiz||quiz.done)return;
  quiz.picked=o; quiz.done=true;
  if(o===quiz.ans){state.points+=1; quiz.fb={ok:true,txt:'答对啦！+1分'};}
  else{quiz.fb={ok:false,txt:'再看看～正确答案是「'+quiz.ans+'」'};}
  save(); render();
}
function doRedeem(id){
  const s=state.shop.find(x=>x.id===id); if(!s)return;
  if(state.points<s.cost){toast('积分还不够哦，继续加油！');return;}
  state.exchanges.push({id:uid(),name:s.name,cost:s.cost,status:'pending',time:Date.now()});
  save(); render(); toast('已申请兑换，等爸爸妈妈确认～');
}
function doExport(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='识字启蒙台备份.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('备份已导出');
}
function doImport(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=()=>{const f=inp.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.lib||!d.today)throw 0; state=d; parentOk=!!state.pwd; save(); quiz=null; cardIdx=0; render(); toast('导入成功');}
      catch(err){toast('文件格式不对，导入失败');}}; r.readAsText(f);};
  inp.click();
}
function clearExample(){
  const pwd=state.pwd; const daily=state.daily;
  const keepShop=state.shop; // 保留家长自定义商城，仅重置学习任务
  state=defaultState(); state.pwd=pwd; state.daily=daily; state.shop=keepShop;
  quiz=null; cardIdx=0; save(); render(); toast('已重置为示例任务');
}
function openClearEg(){
  openModal(`<h3 style="color:var(--red)">${ICON.trash}清空示例数据？</h3>
    <div class="hint">会把当前学习任务重置为示例（日/月/山/水/火），积分、奖励、密码都会保留。</div>
    <div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn warn" data-act="do-cleareg-sample">确认清空</button></div>`);
  document.querySelector('[data-act="do-cleareg-sample"]')?.addEventListener('click',()=>{clearExample();closeModal();});
}
function setPwd(){
  const v=(document.getElementById('pwdInput').value||'').trim();
  if(!/^\d{4}$/.test(v)){toast('请输入4位数字');return;}
  state.pwd=v; parentOk=true; save(); render(); toast('密码设置成功');
}
function login(){
  const v=(document.getElementById('pwdInput').value||'').trim();
  if(v===state.pwd){parentOk=true; render(); toast('欢迎家长');}
  else{toast('密码不正确');}
}
function genToday(){
  const n=Math.max(1,Math.min(20,parseInt(document.getElementById('dailyInput')?.value)||state.daily));
  state.daily=n;
  const chars=state.lib.map(w=>w.char).slice(0,n);
  state.today=chars.map(c=>({char:c,status:'today',learned:false}));
  quiz=null; cardIdx=0; save(); render(); toast('已生成今日'+n+'个字');
}
function openAddWord(){
  openModal(`<h3>${ICON.book}添加自定义字</h3>
    <label>汉字</label><input id="w_char" maxlength="1" placeholder="如 星">
    <label>拼音</label><input id="w_py" placeholder="如 xīng">
    <label>意思</label><input id="w_mn" placeholder="如 星星">
    <label>组词（用空格分开，至少2字）</label><input id="w_words" placeholder="如 星星 星空 红星">
    <div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn main" data-act="add-word">添加</button></div>`);
}
function addWord(){
  const c=(document.getElementById('w_char').value||'').trim();
  const py=(document.getElementById('w_py').value||'').trim();
  const mn=(document.getElementById('w_mn').value||'').trim();
  const ws=(document.getElementById('w_words').value||'').trim().split(/\s+/).filter(Boolean);
  if(!c){toast('请填写汉字');return;}
  if(state.lib.some(x=>x.char===c)){toast('字库里已有这个字');return;}
  if(ws.length<1) ws.push(c+c);
  state.lib.push({char:c,py:py||'—',mn:mn||'—',words:ws.slice(0,4)});
  save(); closeModal(); render(); toast('已添加「'+c+'」');
}
function openLibPool(){
  const inLib=new Set(state.lib.map(w=>w.char));
  const pool=WORDS.filter(w=>!inLib.has(w.char));
  if(!pool.length){openModal(`<h3>字库宝库</h3><div class="empty">常用字都已经加进去啦～</div><div class="row"><button class="btn ghost" data-act="close-modal">知道了</button></div>`);return;}
  const cells=pool.map(w=>`<div class="lib-cell"><div class="lc">${w.char}</div><div class="lp">${w.py}</div><button class="btn green" style="margin-top:6px;min-height:40px" data-act="add-pool" data-char="${w.char}">加入</button></div>`).join('');
  openModal(`<h3>字库宝库</h3><div class="hint">点击加入字库（${pool.length}个可选）</div><div class="lib-grid">${cells}</div><div class="row"><button class="btn ghost" data-act="close-modal">关闭</button></div>`);
}
function addPool(c){
  if(state.lib.some(x=>x.char===c)){toast('已存在');return;}
  const w=WORDS.find(x=>x.char===c); if(!w)return;
  state.lib.push({...w}); save(); render(); toast('已加入「'+c+'」');
  openLibPool();
}
function openAddShop(){
  openModal(`<h3>${ICON.gift}添加奖励</h3>
    <label>奖励名称</label><input id="s_name" placeholder="如 多玩10分钟">
    <label>所需积分</label><input id="s_cost" type="number" min="1" value="10">
    <label>图标</label><select id="s_icon"><option value="starG">星星</option><option value="cookie">饼干</option><option value="toy">玩具</option><option value="book">书</option><option value="heart">爱心</option><option value="gift">礼物</option></select>
    <div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn main" data-act="add-shop">添加</button></div>`);
}
function addShop(){
  const name=(document.getElementById('s_name').value||'').trim();
  const cost=parseInt(document.getElementById('s_cost').value)||0;
  const icon=document.getElementById('s_icon').value;
  if(!name||cost<=0){toast('请填写名称和积分');return;}
  state.shop.push({id:uid(),name,cost,icon}); save(); closeModal(); render(); toast('已添加奖励');
}
function delShop(id){state.shop=state.shop.filter(s=>s.id!==id); save(); render(); toast('已删除');}
function confirmEx(id){
  const e=state.exchanges.find(x=>x.id===id); if(!e)return;
  if(state.points<e.cost){toast('积分不足，无法确认');return;}
  state.points-=e.cost; e.status='done'; save(); render(); toast('已兑换：'+e.name);
}
function rejectEx(id){state.exchanges=state.exchanges.filter(x=>x.id!==id); save(); render(); toast('已拒绝');}
function openChpwd(){
  openModal(`<h3>${ICON.shield}修改密码</h3>
    <label>新密码（4位数字）</label><input id="np" type="password" inputmode="numeric" maxlength="4" placeholder="新密码">
    <div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn main" data-act="chpwd">保存</button></div>`);
}
function chpwd(){
  const v=(document.getElementById('np').value||'').trim();
  if(!/^\d{4}$/.test(v)){toast('请输入4位数字');return;}
  state.pwd=v; save(); closeModal(); render(); toast('密码已修改');
}
function clearAll(){
  openModal(`<h3 style="color:var(--red)">${ICON.trash}清空全部数据？</h3>
    <div class="hint">这会删除所有识字进度、积分、奖励和家长密码，恢复到最初样子。此操作不可恢复！</div>
    <div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn warn" data-act="do-clearall">确认清空</button></div>`);
  document.querySelector('[data-act="do-clearall"]')?.addEventListener('click',()=>{
    state=defaultState(); parentOk=false; quiz=null; cardIdx=0; mode='kid'; save(); closeModal(); render(); toast('已清空全部数据');
  });
}

/* ============ 启动 ============ */
state=load()||defaultState();
(function rollover(){
  const d=new Date().toISOString().slice(0,10);
  if(state.lastDay && state.lastDay!==d){ state.today.forEach(t=>{ if(!t.learned) t.status='overdue'; }); }
  state.lastDay=d;
})();
save(); render();
</script>
</body>
